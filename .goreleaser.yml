# Based on hashicorp/terraform-provider-scaffolding-framework's config
# (goreleaser v2). Produces exactly what a provider registry expects:
# per-platform zips, a _SHA256SUMS file and its detached GPG signature
# (_SHA256SUMS.sig). Release: GPG_FINGERPRINT=<fpr> goreleaser release --clean
version: 2
before:
  hooks:
    - go mod tidy
builds:
  - env:
      # Static binary -- no libc dependency on the machine running tofu.
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    # Only platforms actually running tofu here (macOS laptop, Linux hosts).
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
changelog:
  disable: true
